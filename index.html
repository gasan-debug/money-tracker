#wal .bb{color:var(--blue);font-weight:600;padding:10px 0 0}
.card,.list{contain:layout style}
.sheet.on>:not(.grab):not(.sh):not(.rev){animation:rise .55s var(--e) backwards}

/* liquid-glass specular rim */
.list,.month,.wtr,.rec button,.chip{position:relative}
.card::before,.list::before,.month::before,.gb::before,.pick::before,.fab::before,.toast::before,.seg .th::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}

/* list */

.ic,.ci,.bdg{color:#fff;background:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.08)}
